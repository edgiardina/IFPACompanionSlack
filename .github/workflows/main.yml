name: Deploy Docker Image

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Secrets are not baked into the image. The Synology passes them in as environment variables.

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build Docker image
      run: docker build -t ghcr.io/${{ github.repository_owner }}/ifpa-companion-slack:latest ./IFPACompanionSlack

    - name: Push Docker image
      run: docker push ghcr.io/${{ github.repository_owner }}/ifpa-companion-slack:latest
